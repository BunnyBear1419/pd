          test -f stage18/README.md
          test -f stage18/MATERIAL_LIBRARY_AND_SURFACE_PLAN.md
          test -f stage19/audit_stage19_export_preflight.py
          test -f stage19/README.md
          test -f stage19/COLLISION_AND_EXPORT_PREFLIGHT_CHECKLIST.md
          test -f stage20/audit_stage20_lod_performance.py
