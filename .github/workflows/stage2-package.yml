          test -f stage12/generate_stage12_doors_access.py
          test -f stage12/README.md
          test -f stage12/DOOR_AND_ACCESS_SCHEDULE.md
          test -f stage13/generate_stage13_garage_circulation.py
          test -f stage13/README.md
          test -f stage13/GARAGE_CIRCULATION_CHECKLIST.md
          test -f stage14/generate_stage14_exterior_access.py
