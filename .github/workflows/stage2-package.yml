          test -f stage48/README.md
          test -f stage49/README.md
          test -f stage50/README.md
          test -f stage51/README.md
          test -f stage52/README.md
          test -f stage53/README.md
          test -f stage54/README.md
          test -f stage55/README.md
          python -m py_compile stage2/generate_stage2_blockout.py stage3/generate_stage3_interior.py stage4/generate_stage4_furnishing.py stage5/audit_stage5_scene.py stage6/validate_stage6_layout.py stage7/generate_stage7_branding.py stage8/generate_stage8_wayfinding.py stage9/generate_stage9_emblems.py stage10/generate_stage10_architectural_details.py stage11/generate_stage11_interior_details.py stage12/generate_stage12_doors_access.py stage13/generate_stage13_garage_circulation.py stage14/generate_stage14_exterior_access.py stage15/generate_stage15_site_security.py stage16/audit_stage16_structure.py stage17/audit_stage17_room_circulation.py stage18/generate_stage18_materials.py stage19/audit_stage19_export_preflight.py stage20/audit_stage20_lod_performance.py stage21/audit_stage21_geometry_cleanup.py stage22/audit_stage22_visibility_streaming.py stage23/validate_stage23_resource.py stage24/audit_stage24_build_readiness.py stage25/build_stage25_scene.py stage26/reconcile_stage26_vertical_circulation.py stage27/audit_stage27_room_circulation.py stage28/audit_stage28_garage_secure_layout.py stage29/audit_stage29_room_clearances.py stage30/audit_stage30_exterior_helipad_clearance.py stage31/audit_stage31_optimization_export_manifest.py stage32/final_stage32_production_handoff.py stage34/audit_stage34_architecture_geometry.py stage35/audit_stage35_floor_coordination.py

      - name: Validate Stage 36 room program
        run: python stage36/audit_stage36_room_program.py stage36/room_program_and_adjacency.json

      - name: Validate Stage 37 floor fit
        run: python stage37/audit_stage37_floor_fit.py

      - name: Generate Stage 38 floor-plan previews
        run: python stage38/generate_stage38_floorplan_preview.py --output-dir build/stage38-floorplans

      - name: Verify Stage 38 preview outputs
        run: |
          test -f build/stage38-floorplans/index.html
          test -f build/stage38-floorplans/floor_1.svg
          test -f build/stage38-floorplans/floor_2.svg
          test -f build/stage38-floorplans/floor_3.svg
          test -f build/stage38-floorplans/roof_helipad.svg
          test -f build/stage38-floorplans/stage38_summary.json

      - name: Create ZIP
        run: |
          mkdir -p dist
          zip -r dist/fivem_police_hq_stages_2_through_55.zip stage2 stage3 stage4 stage5 stage6 stage7 stage8 stage9 stage10 stage11 stage12 stage13 stage14 stage15 stage16 stage17 stage18 stage19 stage20 stage21 stage22 stage23 stage24 stage25 stage26 stage27 stage28 stage29 stage30 stage31 stage32 stage33 stage34 stage35 stage36 stage37 stage38 stage39 stage40 stage41 stage42 stage43 stage44 stage45 stage46 stage47 stage48 stage49 stage50 stage51 stage52 stage53 stage54 stage55

      - name: Upload downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fivem-police-hq-stages-2-through-55
          path: dist/fivem_police_hq_stages_2_through_55.zip
          if-no-files-found: error
          retention-days: 30
