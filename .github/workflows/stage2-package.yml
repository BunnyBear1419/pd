name: Package Police HQ MLO Development Stages

on:
  push:
    branches: [main]
    paths:
      - "stage2/**"
      - "stage3/**"
      - ".github/workflows/stage2-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Stage 2 and Stage 3 files
        run: |
          test -f stage2/generate_stage2_blockout.py
          test -f stage2/README.md
          test -f stage2/STAGE2_SCOPE.md
          test -f stage2/OPTIMIZATION_AND_TEST_CHECKLIST.md
          test -f stage3/generate_stage3_interior.py
          test -f stage3/README.md
          test -f stage3/ROOM_LAYOUT_AND_DOOR_SCHEDULE.md
          python -m py_compile stage2/generate_stage2_blockout.py stage3/generate_stage3_interior.py

      - name: Create ZIP
        run: |
          mkdir -p dist
          zip -r dist/fivem_police_hq_stages_2_3.zip stage2 stage3

      - name: Upload downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fivem-police-hq-stages-2-3
          path: dist/fivem_police_hq_stages_2_3.zip
          if-no-files-found: error
          retention-days: 30
