  push:
    branches: [main]
    paths:
      - "stage2/**"
      - "stage3/**"
      - "stage4/**"
      - "stage5/**"
      - "stage6/**"
      - "stage7/**"
      - "stage8/**"
      - "stage9/**"
      - "stage10/**"
      - "stage11/**"
      - "stage12/**"
      - "stage13/**"
      - "stage14/**"
      - "stage15/**"
      - "stage16/**"
      - "stage17/**"
      - "stage18/**"
      - "stage19/**"
      - "stage20/**"
      - "stage21/**"
      - "stage22/**"
      - "stage23/**"
      - "stage24/**"
      - "stage25/**"
      - "stage26/**"
      - "stage27/**"
      - "stage28/**"
      - "stage29/**"
      - "stage30/**"
      - "stage31/**"
      - "stage32/**"
      - "stage33/**"
      - "stage34/**"
      - "stage35/**"
      - "stage36/**"
      - "stage37/**"
      - "stage38/**"
      - "stage39/**"
      - "stage40/**"
      - "stage41/**"
      - "stage42/**"
      - "stage43/**"
      - "stage44/**"
      - "stage45/**"
      - "stage46/**"
      - "stage47/**"
      - "stage48/**"
      - "stage49/**"
      - "stage50/**"
      - "stage51/**"
      - "stage52/**"
      - "stage53/**"
      - "stage54/**"
      - "stage55/**"
      - ".github/workflows/stage2-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate stage scripts and documentation
        run: |
          test -f stage2/generate_stage2_blockout.py
          test -f stage2/README.md
          test -f stage2/STAGE2_SCOPE.md
          test -f stage2/OPTIMIZATION_AND_TEST_CHECKLIST.md
          test -f stage3/generate_stage3_interior.py
          test -f stage3/README.md
          test -f stage3/ROOM_LAYOUT_AND_DOOR_SCHEDULE.md
          test -f stage4/generate_stage4_furnishing.py
          test -f stage4/README.md
          test -f stage4/FURNITURE_AND_EQUIPMENT_PLAN.md
          test -f stage5/audit_stage5_scene.py
          test -f stage5/README.md
          test -f stage5/OPTIMIZATION_AND_EXPORT_PLAN.md
          test -f stage6/validate_stage6_layout.py
          test -f stage6/README.md
          test -f stage6/LAYOUT_VALIDATION_CHECKLIST.md
          test -f stage7/generate_stage7_branding.py
          test -f stage7/README.md
          test -f stage7/BRANDING_AND_SIGNAGE_SCHEDULE.md
          test -f stage8/generate_stage8_wayfinding.py
          test -f stage8/README.md
          test -f stage8/WAYFINDING_SIGNAGE_PLAN.md
          test -f stage9/generate_stage9_emblems.py
          test -f stage9/README.md
          test -f stage9/EMBLEM_AND_BRANDING_GUIDE.md
          test -f stage10/generate_stage10_architectural_details.py
          test -f stage10/README.md
          test -f stage10/ARCHITECTURAL_DETAIL_CHECKLIST.md
          test -f stage11/generate_stage11_interior_details.py
          test -f stage11/README.md
          test -f stage11/INTERIOR_FINISH_AND_CLEARANCE_CHECKLIST.md
          test -f stage12/generate_stage12_doors_access.py
          test -f stage12/README.md
          test -f stage12/DOOR_AND_ACCESS_SCHEDULE.md
          test -f stage13/generate_stage13_garage_circulation.py
          test -f stage13/README.md
          test -f stage13/GARAGE_CIRCULATION_CHECKLIST.md
          test -f stage14/generate_stage14_exterior_access.py
          test -f stage14/README.md
          test -f stage14/EXTERIOR_ACCESS_CLEARANCE_CHECKLIST.md
          test -f stage15/generate_stage15_site_security.py
          test -f stage15/README.md
          test -f stage15/SITE_SECURITY_LANDSCAPE_CHECKLIST.md
          test -f stage16/audit_stage16_structure.py
          test -f stage16/README.md
          test -f stage16/STRUCTURAL_CIRCULATION_CHECKLIST.md
          test -f stage17/audit_stage17_room_circulation.py
          test -f stage17/README.md
          test -f stage17/ROOM_CIRCULATION_CHECKLIST.md
          test -f stage18/generate_stage18_materials.py
          test -f stage18/README.md
          test -f stage18/MATERIAL_LIBRARY_AND_SURFACE_PLAN.md
          test -f stage19/audit_stage19_export_preflight.py
          test -f stage19/README.md
          test -f stage19/COLLISION_AND_EXPORT_PREFLIGHT_CHECKLIST.md
          test -f stage20/audit_stage20_lod_performance.py
          test -f stage20/README.md
          test -f stage20/LOD_AND_PERFORMANCE_CHECKLIST.md
          test -f stage21/audit_stage21_geometry_cleanup.py
          test -f stage21/README.md
          test -f stage21/GEOMETRY_CLEANUP_AND_EXPORT_CHECKLIST.md
          test -f stage22/audit_stage22_visibility_streaming.py
          test -f stage22/README.md
          test -f stage22/VISIBILITY_STREAMING_AND_MLO_CHECKLIST.md
          test -f stage23/validate_stage23_resource.py
          test -f stage23/fxmanifest.lua.template
          test -f stage23/README.md
          test -f stage23/RESOURCE_PACKAGING_AND_INSTALL_CHECKLIST.md
          test -f stage24/audit_stage24_build_readiness.py
          test -f stage24/README.md
          test -f stage24/BUILD_READINESS_AND_REMAINING_WORK.md
          test -f stage25/build_stage25_scene.py
          test -f stage25/README.md
          test -f stage25/BLENDER_BUILD_AND_ACCEPTANCE_CHECKLIST.md
          test -f stage26/reconcile_stage26_vertical_circulation.py
          test -f stage27/audit_stage27_room_circulation.py
          test -f stage26/README.md
          test -f stage26/VERTICAL_CIRCULATION_ACCEPTANCE_CHECKLIST.md
          test -f stage27/audit_stage27_room_circulation.py
          test -f stage27/README.md
          test -f stage27/ROOM_CIRCULATION_ACCEPTANCE_CHECKLIST.md
          test -f stage28/audit_stage28_garage_secure_layout.py
          test -f stage28/README.md
          test -f stage28/GARAGE_SECURE_LAYOUT_ACCEPTANCE_CHECKLIST.md
          test -f stage29/audit_stage29_room_clearances.py
          test -f stage29/README.md
          test -f stage29/ROOM_DIMENSIONS_DOOR_CLEARANCE_ACCEPTANCE_CHECKLIST.md
          test -f stage30/audit_stage30_exterior_helipad_clearance.py
          test -f stage30/README.md
          test -f stage30/EXTERIOR_SITE_EMERGENCY_ACCESS_HELIPAD_ACCEPTANCE_CHECKLIST.md
          test -f stage31/audit_stage31_optimization_export_manifest.py
          test -f stage31/README.md
          test -f stage31/OPTIMIZATION_AND_EXPORT_MANIFEST_CHECKLIST.md
          test -f stage32/final_stage32_production_handoff.py
          test -f stage32/README.md
          test -f stage32/FINAL_PRODUCTION_HANDOFF_ACCEPTANCE_CHECKLIST.md
          test -f stage33/README.md
          test -f stage33/SAFE_BUILD_ACCEPTANCE_CHECKLIST.md
          test -f stage34/audit_stage34_architecture_geometry.py
          test -f stage34/README.md
          test -f stage34/ARCHITECTURE_GEOMETRY_ACCEPTANCE_CHECKLIST.md
          test -f stage35/audit_stage35_floor_coordination.py
          test -f stage35/README.md
          test -f stage35/FLOOR_COORDINATION_ACCEPTANCE_CHECKLIST.md
          test -f stage36/room_program_and_adjacency.json
          test -f stage36/audit_stage36_room_program.py
          test -f stage36/README.md
          test -f stage36/ROOM_PROGRAM_ACCEPTANCE_CHECKLIST.md
          test -f stage37/audit_stage37_floor_fit.py
          test -f stage37/README.md
          test -f stage37/FLOOR_FIT_ACCEPTANCE_CHECKLIST.md
          test -f stage38/generate_stage38_floorplan_preview.py
          test -f stage38/README.md
          test -f stage38/FLOORPLAN_REVIEW_CHECKLIST.md
          test -f stage39/README.md
          test -f stage39/audit_stage39_adjacency.py
          test -f stage39/ROOM_ADJACENCY_AUDIT_CHECKLIST.md
          test -f stage40/README.md
          test -f stage40/generate_stage40_wall_door_schedule.py
          test -f stage40/WALL_OPENING_DOOR_REVIEW_CHECKLIST.md
          test -f stage41/README.md
          test -f stage41/generate_stage41_48_design_specs.py
          test -f stage42/README.md
          test -f stage42/generate_stage42_shell_geometry.py
          test -f stage42/build_stage42_shells_blender.py
          test -f stage43/README.md
          test -f stage43/generate_stage43_furniture_blockout.py
          test -f stage44/README.md
          test -f stage44/generate_stage44_lighting_manifest.py
          test -f stage44/build_stage44_lighting_blender.py
          test -f stage45/README.md
          test -f stage45/generate_stage45_material_manifest.py
          test -f stage45/audit_stage45_material_assets.py
          test -f stage45/build_stage45_materials_blender.py
          test -f stage46/README.md
          test -f stage46/generate_stage46_uv_plan.py
          test -f stage46/audit_stage46_uvs_blender.py
          test -f stage47/README.md
          test -f stage47/generate_stage47_geometry_lod_plan.py
          test -f stage47/audit_stage47_blender_geometry.py
          test -f stage48/README.md
          test -f stage48/audit_stage48_pre_export.py
          test -f stage49/README.md
          test -f stage49/audit_stage49_55_release_gate.py
          test -f stage49/validate_export_manifest.py
          test -f stage50/audit_stage50_collision_visibility.py
          test -f stage51/audit_stage51_resource_deployment.py
          test -f stage50/README.md
          test -f stage50/audit_stage50_collision_visibility.py
          test -f stage51/README.md
          test -f stage51/audit_stage51_resource_deployment.py
          test -f stage51/README.md
          test -f stage52/README.md
          test -f stage53/README.md
          test -f stage54/README.md
          test -f stage55/README.md
          python -m py_compile stage2/generate_stage2_blockout.py stage3/generate_stage3_interior.py stage4/generate_stage4_furnishing.py stage5/audit_stage5_scene.py stage6/validate_stage6_layout.py stage7/generate_stage7_branding.py stage8/generate_stage8_wayfinding.py stage9/generate_stage9_emblems.py stage10/generate_stage10_architectural_details.py stage11/generate_stage11_interior_details.py stage12/generate_stage12_doors_access.py stage13/generate_stage13_garage_circulation.py stage14/generate_stage14_exterior_access.py stage15/generate_stage15_site_security.py stage16/audit_stage16_structure.py stage17/audit_stage17_room_circulation.py stage18/generate_stage18_materials.py stage19/audit_stage19_export_preflight.py stage20/audit_stage20_lod_performance.py stage21/audit_stage21_geometry_cleanup.py stage22/audit_stage22_visibility_streaming.py stage23/validate_stage23_resource.py stage24/audit_stage24_build_readiness.py stage25/build_stage25_scene.py stage26/reconcile_stage26_vertical_circulation.py stage27/audit_stage27_room_circulation.py stage28/audit_stage28_garage_secure_layout.py stage29/audit_stage29_room_clearances.py stage30/audit_stage30_exterior_helipad_clearance.py stage31/audit_stage31_optimization_export_manifest.py stage32/final_stage32_production_handoff.py stage34/audit_stage34_architecture_geometry.py stage35/audit_stage35_floor_coordination.py stage38/generate_stage38_floorplan_preview.py stage39/audit_stage39_adjacency.py stage40/generate_stage40_wall_door_schedule.py stage41/generate_stage41_48_design_specs.py stage42/generate_stage42_shell_geometry.py stage42/build_stage42_shells_blender.py stage43/generate_stage43_furniture_blockout.py stage44/generate_stage44_lighting_manifest.py stage44/build_stage44_lighting_blender.py stage45/generate_stage45_material_manifest.py stage45/audit_stage45_material_assets.py stage45/build_stage45_materials_blender.py stage46/generate_stage46_uv_plan.py stage46/audit_stage46_uvs_blender.py stage47/generate_stage47_geometry_lod_plan.py stage47/audit_stage47_blender_geometry.py stage48/audit_stage48_pre_export.py stage49/audit_stage49_55_release_gate.py stage49/validate_export_manifest.py stage50/audit_stage50_collision_visibility.py stage51/audit_stage51_resource_deployment.py

      - name: Validate Stage 36 room program
        run: python stage36/audit_stage36_room_program.py stage36/room_program_and_adjacency.json

      - name: Validate Stage 37 floor fit
        run: python stage37/audit_stage37_floor_fit.py --output build/stage37_floor_fit.json

      - name: Generate Stage 38 floor-plan previews
        run: python stage38/generate_stage38_floorplan_preview.py --output-dir build/stage38-floorplans

      - name: Verify Stage 38 preview outputs
        run: |
          test -f build/stage38-floorplans/index.html
          test -f build/stage38-floorplans/floor_1.svg
          test -f build/stage38-floorplans/floor_2.svg
          test -f build/stage38-floorplans/floor_3.svg
          test -f build/stage38-floorplans/roof_helipad.svg
          test -f build/stage38-floorplans/stage38_summary.json

      - name: Run Stage 39 room-adjacency audit
        run: python stage39/audit_stage39_adjacency.py --output build/stage39_adjacency_report.json

      - name: Verify Stage 39 report
        run: test -s build/stage39_adjacency_report.json

      - name: Run Stage 40 wall and door coordination
        run: python stage40/generate_stage40_wall_door_schedule.py --output build/stage40_wall_door_schedule.json

      - name: Verify Stage 40 coordination report
        run: |
          test -s build/stage40_wall_door_schedule.json
          python -c "import json; r=json.load(open('build/stage40_wall_door_schedule.json', encoding='utf-8')); assert r['stage'] == 40 and r['production_ready'] is False"

      - name: Generate Stage 42 schematic shell geometry
        run: python stage42/generate_stage42_shell_geometry.py --output build/stage42_shell_geometry.json

      - name: Verify Stage 42 shell manifest
        run: |
          test -s build/stage42_shell_geometry.json
          python -c "import json; r=json.load(open('build/stage42_shell_geometry.json', encoding='utf-8')); assert r['stage'] == 42 and r['production_ready'] is False and r['counts']['geometry_boxes'] > 0"
      - name: Generate Stage 41-48 design specification
        run: python stage41/generate_stage41_48_design_specs.py --output build/stage41_48_design_spec.json

      - name: Verify Stage 41-48 specification
        run: |
          test -s build/stage41_48_design_spec.json
          python -c "import json; r=json.load(open('build/stage41_48_design_spec.json', encoding='utf-8')); assert r['stage_range'] == '41-48' and r['production_ready'] is False and len(r['rooms']) > 0"

      - name: Generate Stage 43 furniture and equipment blockout
        run: python stage43/generate_stage43_furniture_blockout.py --spec build/stage41_48_design_spec.json --fit-report build/stage37_floor_fit.json --output build/stage43_furniture_blockout.json

      - name: Verify Stage 43 furniture blockout
        run: |
          test -s build/stage43_furniture_blockout.json
          python -c "import json; r=json.load(open('build/stage43_furniture_blockout.json', encoding='utf-8')); assert r['stage'] == 43 and r['production_ready'] is False and isinstance(r['geometry'], list)"

      - name: Generate Stage 44 lighting manifest
        run: python stage44/generate_stage44_lighting_manifest.py --spec build/stage41_48_design_spec.json --fit-report build/stage37_floor_fit.json --output build/stage44_lighting_manifest.json

      - name: Verify Stage 44 lighting manifest
        run: |
          test -s build/stage44_lighting_manifest.json
          python -c "import json; r=json.load(open('build/stage44_lighting_manifest.json', encoding='utf-8')); assert r['stage'] == 44 and r['production_ready'] is False and len(r['lights']) > 0"

      - name: Generate Stage 45 reusable material manifest
        run: python stage45/generate_stage45_material_manifest.py --output build/stage45_material_manifest.json

      - name: Verify Stage 45 material manifest and texture paths
        run: |
          test -s build/stage45_material_manifest.json
          python -c "import json; r=json.load(open('build/stage45_material_manifest.json', encoding='utf-8')); assert r['stage'] == 45 and r['production_ready'] is False and r['counts']['materials'] >= 10 and len({m['name'] for m in r['materials']}) == len(r['materials'])"
          python stage45/audit_stage45_material_assets.py build/stage45_material_manifest.json --project-root .

      - name: Generate Stage 46 UV and atlas plan
        run: python stage46/generate_stage46_uv_plan.py --materials build/stage45_material_manifest.json --output build/stage46_uv_atlas_plan.json

      - name: Verify Stage 46 UV and atlas plan
        run: |
          test -s build/stage46_uv_atlas_plan.json
          python -c "import json; r=json.load(open('build/stage46_uv_atlas_plan.json', encoding='utf-8')); assert r['stage'] == 46 and r['production_ready'] is False and r['counts']['atlas_plans'] > 0"

      - name: Generate Stage 47 geometry and LOD review plan
        run: python stage47/generate_stage47_geometry_lod_plan.py --shell build/stage42_shell_geometry.json --furniture build/stage43_furniture_blockout.json --output build/stage47_geometry_lod_plan.json

      - name: Verify Stage 47 geometry and LOD review plan
        run: |
          test -s build/stage47_geometry_lod_plan.json
          python -c "import json; r=json.load(open('build/stage47_geometry_lod_plan.json', encoding='utf-8')); assert r['stage'] == 47 and r['production_ready'] is False and r['inputs']['stage42_geometry_boxes'] > 0 and r['inputs']['stage43_furniture_boxes'] >= 0"

      - name: Generate Stage 48 integrated pre-export report
        run: python stage48/audit_stage48_pre_export.py --root . --output build/stage48_pre_export_report.json

      - name: Verify Stage 48 pre-export report
        run: |
          test -s build/stage48_pre_export_report.json
          python -c "import json; r=json.load(open('build/stage48_pre_export_report.json', encoding='utf-8')); assert r['stage'] == 48 and r['production_ready'] is False and len(r['checks']) == 6 and not r['blocking_inputs']"

      - name: Self-test Stage 49 export manifest validator
        run: python stage49/validate_export_manifest.py --self-test

      - name: Self-test Stage 51 resource deployment audit
        run: python stage51/audit_stage51_resource_deployment.py --self-test

      - name: Audit Stage 49-55 external release evidence
        run: python stage49/audit_stage49_55_release_gate.py --output build/stage49_55_release_gate.json

      - name: Verify Stage 49-55 release gate
        run: |
          test -s build/stage49_55_release_gate.json
          python -c "import json; r=json.load(open('build/stage49_55_release_gate.json', encoding='utf-8')); assert r['stage_range'] == '49-55' and r['production_ready'] is False"

      - name: Create ZIP
        run: |
          mkdir -p dist
          zip -r dist/fivem_police_hq_stages_2_through_55.zip stage2 stage3 stage4 stage5 stage6 stage7 stage8 stage9 stage10 stage11 stage12 stage13 stage14 stage15 stage16 stage17 stage18 stage19 stage20 stage21 stage22 stage23 stage24 stage25 stage26 stage27 stage28 stage29 stage30 stage31 stage32 stage33 stage34 stage35 stage36 stage37 stage38 stage39 stage40 stage41 stage42 stage43 stage44 stage45 stage46 stage47 stage48 stage49 stage50 stage51 stage52 stage53 stage54 stage55

      - name: Upload downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fivem-police-hq-stages-2-through-55
          path: dist/fivem_police_hq_stages_2_through_55.zip
          if-no-files-found: error
          retention-days: 30
