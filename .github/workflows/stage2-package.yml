name: Package Police HQ MLO Development Stages

on:
  push:
    branches: [main]
    paths:
      - "stage2/**"
      - "stage3/**"
      - "stage4/**"
      - "stage5/**"
      - "stage6/**"
      - "stage7/**"
      - "stage8/**"
      - "stage9/**"
      - "stage10/**"
      - "stage11/**"
      - "stage12/**"
      - "stage13/**"
      - "stage14/**"
      - "stage15/**"
      - "stage16/**"
      - "stage17/**"
      - "stage18/**"
      - "stage19/**"
      - "stage20/**"
      - "stage21/**"
      - "stage22/**"
      - "stage23/**"
      - "stage24/**"
      - "stage25/**"
      - "stage26/**"
      - "stage27/**"
      - "stage28/**"
      - "stage29/**"
